server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: bwg-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pcmc_bwg}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_32_BYTE_MINIMUM_SECRET_KEY_FOR_PCMC_BWG_JWT_SIGNING}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: pcmc-bwg-backend

  otp:
    length: ${OTP_LENGTH:6}
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    max-resend: ${OTP_MAX_RESEND:3}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}

  aadhaar:
    encryption-key: ${AADHAAR_ENCRYPTION_KEY:CHANGE_ME_16B_KEY}

  file-storage:
    upload-dir: ${FILE_UPLOAD_DIR:uploads/photos}
    base-url: ${FILE_BASE_URL:/files/photos}

  admin-seed:
    username: ${ADMIN_SEED_USERNAME:admin}
    password: ${ADMIN_SEED_PASSWORD:Admin@12345}
    enabled: ${ADMIN_SEED_ENABLED:true}

logging:
  level:
    root: INFO
    com.pcmc.bwg: INFO
