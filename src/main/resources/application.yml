server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: bwg-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pcmc_bwg}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Allows the new lower-numbered safety-net migrations (V1_1, V3_1 - see
    # their file comments) to run even though this database may already have
    # higher-numbered migrations (up to V9) applied. Both are guarded/idempotent
    # (CREATE TABLE IF NOT EXISTS / existence checks) so they are safe no-ops on
    # a database that already has bwg_survey, and only actually do work on a
    # brand-new, empty database.
    out-of-order: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_32_BYTE_MINIMUM_SECRET_KEY_FOR_PCMC_BWG_JWT_SIGNING}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: pcmc-bwg-backend

  otp:
    length: ${OTP_LENGTH:6}
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    max-resend: ${OTP_MAX_RESEND:3}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}

  aadhaar:
    encryption-key: ${AADHAAR_ENCRYPTION_KEY:CHANGE_ME_16B_KEY}

  file-storage:
    upload-dir: ${FILE_UPLOAD_DIR:uploads/photos}
    base-url: ${FILE_BASE_URL:/files/photos}

  internal-bridge:
    # Shared secret the mobile app backend must send as the
    # X-Internal-Api-Key header when pushing survey data to
    # /api/internal/surveys/ingest. Generate a real random value for
    # each environment - do not use the placeholder in production.
    api-key: ${INTERNAL_BRIDGE_API_KEY:pcmc-bwg-local-dev-bridge-key-2026}
    enabled: ${INTERNAL_BRIDGE_ENABLED:true}

  admin-seed:
    username: ${ADMIN_SEED_USERNAME:admin}
    password: ${ADMIN_SEED_PASSWORD:Admin@12345}
    enabled: ${ADMIN_SEED_ENABLED:true}

logging:
  level:
    root: INFO
    com.pcmc.bwg: INFO
